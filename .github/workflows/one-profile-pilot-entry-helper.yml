name: One Profile Pilot Entry Helper

on:
  push:
    branches:
      - phase3/one-profile-live-pilot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase3/one-profile-live-pilot
      - name: Wire pilot into control entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/control/entry.ts')
          s = p.read_text()

          old = "import { getSettings } from '../repositories/settings.repository.js';\n"
          new = old + "import { getEventFlowPilotState } from '../repositories/eventflow-pilot.repository.js';\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "import { applyPhase3DiscoveryQualityRevision } from '../services/phase3-discovery-quality-revision.service.js';\n"
          new = old + "import { pilotPublicProfileUrl, runOneProfileEventFlowPilot } from '../services/eventflow-one-profile-pilot.service.js';\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "const PHASE3_RECOVERY_INTERVAL_MS = 30 * 60 * 1000;\n"
          new = old + "const ONE_PROFILE_PILOT_RECONCILE_MS = 60_000;\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  const [report, discovery] = await Promise.all([\n    getPhase3ValidationReport(settings),\n    getDiscoveryQueueDiagnostic(),\n  ]);"
          new = "  const [report, discovery, pilot] = await Promise.all([\n    getPhase3ValidationReport(settings),\n    getDiscoveryQueueDiagnostic(),\n    getEventFlowPilotState(),\n  ]);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    discovery: {\n      queue: discovery.counts,\n      latestFailure,\n      latestCompletion,\n    },\n    metrics: {"
          new = "    discovery: {\n      queue: discovery.counts,\n      latestFailure,\n      latestCompletion,\n    },\n    oneProfilePilot: {\n      status: pilot?.status ?? 'not_started',\n      businessName: pilot?.businessName ?? null,\n      reason: pilot?.reason ?? null,\n      publicProfileUrl: pilotPublicProfileUrl(pilot),\n      publishedAt: pilot?.publishedAt ?? null,\n    },\n    metrics: {"
          assert old in s
          s = s.replace(old, new, 1)

          anchor = "  if (!autostartOutcome?.started) {\n"
          addition = "  await runOneProfileEventFlowPilot()\n    .then(outcome => logger.info({ oneProfilePilot: outcome }, 'One-profile EventFlow pilot evaluated'))\n    .catch(error => logger.error({ err: error }, 'One-profile EventFlow pilot failed'));\n\n"
          assert anchor in s
          s = s.replace(anchor, addition + anchor, 1)

          old = "  recoveryTimer.unref();\n\n  await import('./server.js');"
          new = "  recoveryTimer.unref();\n\n  const pilotTimer = setInterval(() => {\n    void runOneProfileEventFlowPilot()\n      .then(() => writePublicPhase3Progress())\n      .catch(error => logger.error({ err: error }, 'One-profile EventFlow pilot reconcile failed'));\n  }, ONE_PROFILE_PILOT_RECONCILE_MS);\n  pilotTimer.unref();\n\n  await import('./server.js');"
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Remove temporary helper and commit
        run: |
          set -euo pipefail
          rm .github/workflows/one-profile-pilot-entry-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/control/entry.ts .github/workflows/one-profile-pilot-entry-helper.yml
          git commit -m "Wire autonomous one-profile production pilot"
          git push origin HEAD:phase3/one-profile-live-pilot
